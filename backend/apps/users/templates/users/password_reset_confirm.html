<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Nueva contraseña</title></head>
<body>
{% if validlink %}
    <h1>Ingresa tu nueva contraseña</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cambiar contraseña</button>
    </form>
{% else %}
    <h1>El enlace no es válido</h1>
    <p>Este enlace de recuperación ya fue usado o expiró. Solicita uno nuevo.</p>
    <a href="{% url 'users:password_reset' %}">Solicitar nuevo enlace</a>
{% endif %}
</body>
</html>
