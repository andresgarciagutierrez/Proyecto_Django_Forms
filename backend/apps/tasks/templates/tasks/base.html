{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Mis tareas
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/tasks.css' %}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="navbar-container">

            <a
                href="{% url 'tasks:list' %}"
                class="brand"
            >
                Mis tareas
            </a>

            <a
                href="{% url 'tasks:create' %}"
                class="nav-button"
            >
                + Nueva tarea
            </a>

        </div>

    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
